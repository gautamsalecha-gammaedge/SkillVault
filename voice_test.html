<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SkillVault — Voice Test</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --panel-line: #2a2f34;
    --amber: #e8a33d;
    --amber-dim: #7a5b28;
    --text: #e5e5e0;
    --text-dim: #8a8f94;
    --ok: #5fa876;
    --err: #c0564f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Consolas", "SF Mono", "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
  }
  .header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--panel-line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text);
  }
  .header span {
    font-size: 11px;
    color: var(--text-dim);
  }
  .body { padding: 24px; }

  .row { margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  select, input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 9px 10px;
    font-family: inherit;
    font-size: 13px;
    border-radius: 2px;
  }
  select:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--amber-dim);
  }

  .mode-toggle {
    display: flex;
    border: 1px solid var(--panel-line);
    border-radius: 2px;
    overflow: hidden;
  }
  .mode-toggle button {
    flex: 1;
    padding: 9px 0;
    background: var(--bg);
    color: var(--text-dim);
    border: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .mode-toggle button.active {
    background: var(--amber-dim);
    color: var(--text);
  }

  .mic-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 0 4px;
  }
  .mic-btn {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--amber-dim);
    background: transparent;
    color: var(--amber);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .mic-btn:hover { border-color: var(--amber); }
  .mic-btn.listening {
    background: var(--amber-dim);
    border-color: var(--amber);
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(232, 163, 61, 0.35); }
    70%  { box-shadow: 0 0 0 12px rgba(232, 163, 61, 0); }
    100% { box-shadow: 0 0 0 0 rgba(232, 163, 61, 0); }
  }
  .status {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .status.listening { color: var(--amber); }
  .status.err { color: var(--err); }

  .transcript-box {
    min-height: 44px;
    background: var(--bg);
    border: 1px solid var(--panel-line);
    border-radius: 2px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .transcript-box.empty {
    color: var(--text-dim);
    font-style: italic;
  }

  .go-btn {
    width: 100%;
    padding: 11px 0;
    margin-top: 14px;
    background: var(--amber);
    border: none;
    border-radius: 2px;
    color: #1a1200;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: bold;
    cursor: pointer;
  }
  .go-btn:disabled {
    background: var(--panel-line);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  .answer-panel {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--panel-line);
  }
  .answer-panel label { color: var(--ok); }
  .answer-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
  }
  .speak-btn {
    margin-top: 10px;
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    padding: 6px 12px;
    font-family: inherit;
    font-size: 11px;
    border-radius: 2px;
    cursor: pointer;
  }
  .speak-btn:hover { color: var(--text); border-color: var(--amber-dim); }

  .foot-note {
    padding: 12px 24px;
    border-top: 1px solid var(--panel-line);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  .worker-fields {
    display: none;
    gap: 10px;
  }
  .worker-fields.show { display: grid; grid-template-columns: 1fr 1fr; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>SkillVault — Voice Test</h1>
    <span id="api-base-label">127.0.0.1:8000</span>
  </div>

  <div class="body">

    <div class="row">
      <label>Mode</label>
      <div class="mode-toggle">
        <button id="mode-ask" class="active">Ask</button>
        <button id="mode-add">Add Knowledge</button>
      </div>
    </div>

    <div class="row">
      <label>Spoken language</label>
      <select id="lang-select">
        <option value="hi-IN">Hindi (hi-IN)</option>
        <option value="en-IN" selected>English — India (en-IN)</option>
        <option value="mr-IN">Marathi (mr-IN)</option>
        <option value="ta-IN">Tamil (ta-IN)</option>
        <option value="ur-IN">Urdu (ur-IN)</option>
      </select>
    </div>

    <div class="row">
      <label>Machine ID</label>
      <input type="text" id="machine-id" value="CNC-204" />
    </div>

    <div class="row worker-fields" id="worker-fields">
      <div>
        <label>Worker token</label>
        <input type="text" id="worker-token" placeholder="paste Bearer token" />
      </div>
      <div>
        <label>&nbsp;</label>
        <input type="text" id="worker-hint" value="from /worker/login" disabled />
      </div>
    </div>

    <div class="mic-row">
      <button id="mic-btn" class="mic-btn">●</button>
      <div>
        <div id="status" class="status">Tap to speak</div>
      </div>
    </div>

    <div class="row">
      <label>Transcript (editable)</label>
      <div id="transcript" class="transcript-box empty" contenteditable="true" data-placeholder="Your speech will appear here...">Your speech will appear here...</div>
    </div>

    <button id="go-btn" class="go-btn" disabled>Send</button>

    <div class="answer-panel" id="answer-panel" style="display:none;">
      <label id="answer-label">Answer</label>
      <div id="answer-text" class="answer-text"></div>
      <button id="speak-btn" class="speak-btn">▶ Speak answer</button>
    </div>

  </div>

  <div class="foot-note">
    Uses the browser's Web Speech API (Chrome/Edge recommended) — no audio leaves your machine except the transcribed text sent to your local API.
  </div>
</div>

<script>
  const API_BASE = "http://127.0.0.1:8000";
  document.getElementById("api-base-label").textContent = API_BASE.replace("http://", "");

  let mode = "ask"; // "ask" | "add"
  const modeAskBtn = document.getElementById("mode-ask");
  const modeAddBtn = document.getElementById("mode-add");
  const workerFields = document.getElementById("worker-fields");
  const goBtn = document.getElementById("go-btn");
  const answerPanel = document.getElementById("answer-panel");
  const answerLabel = document.getElementById("answer-label");
  const answerText = document.getElementById("answer-text");
  const speakBtn = document.getElementById("speak-btn");
  const transcriptEl = document.getElementById("transcript");
  const statusEl = document.getElementById("status");
  const micBtn = document.getElementById("mic-btn");
  const langSelect = document.getElementById("lang-select");
  const machineIdInput = document.getElementById("machine-id");
  const workerTokenInput = document.getElementById("worker-token");

  function setMode(newMode) {
    mode = newMode;
    modeAskBtn.classList.toggle("active", mode === "ask");
    modeAddBtn.classList.toggle("active", mode === "add");
    workerFields.classList.toggle("show", mode === "add");
    goBtn.textContent = mode === "ask" ? "Send" : "Submit knowledge";
    answerPanel.style.display = "none";
  }
  modeAskBtn.addEventListener("click", () => setMode("ask"));
  modeAddBtn.addEventListener("click", () => setMode("add"));

  // --- Transcript placeholder handling ---
  transcriptEl.addEventListener("focus", () => {
    if (transcriptEl.classList.contains("empty")) {
      transcriptEl.textContent = "";
      transcriptEl.classList.remove("empty");
    }
  });
  transcriptEl.addEventListener("input", () => {
    goBtn.disabled = transcriptEl.textContent.trim().length === 0;
  });

  // --- Web Speech API: recognition ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add("listening");
      statusEl.textContent = "Listening…";
      statusEl.className = "status listening";
    };

    recognition.onresult = (event) => {
      let finalText = "";
      for (let i = 0; i < event.results.length; i++) {
        finalText += event.results[i][0].transcript;
      }
      transcriptEl.textContent = finalText;
      transcriptEl.classList.remove("empty");
      goBtn.disabled = finalText.trim().length === 0;
    };

    recognition.onerror = (event) => {
      statusEl.textContent = "Mic error: " + event.error;
      statusEl.className = "status err";
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove("listening");
      if (statusEl.className !== "status err") {
        statusEl.textContent = "Tap to speak";
        statusEl.className = "status";
      }
    };
  } else {
    statusEl.textContent = "SpeechRecognition not supported in this browser — try Chrome or Edge.";
    statusEl.className = "status err";
    micBtn.disabled = true;
  }

  micBtn.addEventListener("click", () => {
    if (!recognition) return;
    if (listening) {
      recognition.stop();
      return;
    }
    recognition.lang = langSelect.value;
    recognition.start();
  });

  // --- Send to backend ---
  goBtn.addEventListener("click", async () => {
    const text = transcriptEl.textContent.trim();
    if (!text) return;

    const machineId = machineIdInput.value.trim() || "CNC-204";
    goBtn.disabled = true;
    goBtn.textContent = "Working…";
    answerPanel.style.display = "none";

    try {
      if (mode === "ask") {
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text, machine_id: machineId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");

        answerLabel.textContent = `Answer (sources used: ${data.sources_used ?? 0})`;
        answerText.textContent = data.answer;
        answerPanel.style.display = "block";
      } else {
        const token = workerTokenInput.value.trim();
        if (!token) {
          alert("Paste a worker Bearer token first (get one from POST /worker/login in /docs).");
          return;
        }
        const res = await fetch(`${API_BASE}/add-knowledge`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify({ text: text, machine_id: machineId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");

        answerLabel.textContent = "Saved";
        answerText.textContent = `${data.status}\nAdded by: ${data.added_by}\nID: ${data.id}`;
        answerPanel.style.display = "block";
      }
    } catch (err) {
      answerLabel.textContent = "Error";
      answerText.textContent = err.message;
      answerPanel.style.display = "block";
    } finally {
      goBtn.disabled = false;
      goBtn.textContent = mode === "ask" ? "Send" : "Submit knowledge";
    }
  });

  // --- Text-to-speech via Sarvam (proper Indian accent, regardless of local OS voices) ---
  speakBtn.addEventListener("click", async () => {
    const text = answerText.textContent.trim();
    if (!text) return;

    speakBtn.disabled = true;
    speakBtn.textContent = "Generating audio…";

    try {
      const res = await fetch(`${API_BASE}/speak`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, language_code: langSelect.value }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.detail || "Text-to-speech request failed");
      }

      const audioBlob = await res.blob();
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);
      audio.play();
    } catch (err) {
      alert("Could not play audio: " + err.message);
    } finally {
      speakBtn.disabled = false;
      speakBtn.textContent = "▶ Speak answer";
    }
  });
</script>

</body>
</html>
