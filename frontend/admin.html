<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>SkillVault — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/admin.css" />
<style>
  /* Minimal styling for the existing/new-machine toggle. Move these into
     admin.css whenever convenient - kept inline here so this file works
     standalone without needing changes to a file we didn't have on hand. */
  .segmented { display: inline-flex; border: 1px solid var(--border, #333); border-radius: 8px; overflow: hidden; margin: 12px 0; }
  .segmented-btn { padding: 8px 16px; background: transparent; border: none; color: var(--text-faint, #999); cursor: pointer; font: inherit; }
  .segmented-btn.is-active { background: var(--accent, #E8A33D); color: #17130a; font-weight: 600; }
  .segmented-btn:not(.is-active):hover { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>

<div class="admin-topbar">
  <button class="icon-btn" id="btn-menu-toggle" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <strong data-i18n="appName" style="font-family:var(--font-display);">SkillVault</strong>
  <span style="width:36px;"></span>
</div>

<div class="admin-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z" stroke="#17130a" stroke-width="2" stroke-linejoin="round" fill="none"/><path d="M9 12l2 2 4-4" stroke="#17130a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <strong data-i18n="appName">SkillVault</strong>
        <span data-i18n="admin">Admin</span>
      </div>
    </div>

    <button class="nav-item" role="tab" aria-selected="true" id="nav-pending-workers">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span data-i18n="navPendingWorkers">Pending workers</span>
      <span class="nav-count" id="count-pending-workers">0</span>
    </button>
    <button class="nav-item" role="tab" aria-selected="false" id="nav-workers">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span data-i18n="navWorkersMachines">Workers & machines</span>
    </button>
    <button class="nav-item" role="tab" aria-selected="false" id="nav-knowledge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></svg>
      <span data-i18n="navKnowledge">Knowledge review</span>
      <span class="nav-count" id="count-knowledge">0</span>
    </button>
    <button class="nav-item" role="tab" aria-selected="false" id="nav-manuals">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
      <span data-i18n="navManuals">Manuals</span>
    </button>

    <div class="sidebar-footer">
      <button class="btn btn--ghost btn--block" id="btn-logout" style="justify-content:flex-start;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span data-i18n="logout">Log out</span>
      </button>
    </div>
  </aside>

  <main class="admin-content">

    <!-- PANEL: pending workers -->
    <section class="admin-panel is-active" id="panel-pending-workers">
      <div class="content-header">
        <h2 data-i18n="pendingWorkersTitle">Waiting for approval</h2>
      </div>
      <div class="list" id="pending-workers-list"></div>
    </section>

    <!-- PANEL: workers & machines -->
    <section class="admin-panel" id="panel-workers">
      <div class="content-header">
        <h2 data-i18n="workersTitle">All workers</h2>
      </div>
      <div class="list" id="workers-list"></div>
    </section>

    <!-- PANEL: knowledge review -->
    <section class="admin-panel" id="panel-knowledge">
      <div class="content-header">
        <h2 data-i18n="knowledgeTitle">Review submitted tips</h2>
        <p data-i18n="selectMachineToReview">Select a machine to review its pending tips.</p>
      </div>
      <div class="machine-picker-bar">
        <select class="select" id="knowledge-machine-select"></select>
      </div>
      <div class="list" id="knowledge-list"></div>
    </section>

    <!-- PANEL: manuals -->
    <section class="admin-panel" id="panel-manuals">
      <div class="content-header">
        <h2 data-i18n="manualsTitle">Manuals</h2>
        <p data-i18n="selectMachineForManuals">Choose a machine to manage its manuals, or add a brand new one.</p>
      </div>

      <!-- Explicit mode toggle: forces the admin to consciously pick
           "existing machine" vs "new machine" instead of two silently
           competing inputs feeding one ambiguous fallback. -->
      <div class="segmented" role="tablist" aria-label="Machine target mode">
        <button type="button" class="segmented-btn is-active" id="mode-existing-btn" role="tab" aria-selected="true" data-i18n="existingMachineMode">Existing machine</button>
        <button type="button" class="segmented-btn" id="mode-new-btn" role="tab" aria-selected="false" data-i18n="newMachineMode">+ New machine</button>
      </div>

      <div class="machine-picker-bar" id="existing-machine-row">
        <select class="select" id="manuals-machine-select"></select>
      </div>

      <div class="machine-picker-bar" id="new-machine-row" style="display:none;">
        <input type="text" class="input" id="new-machine-id" data-i18n-ph="machineIdPlaceholder" placeholder="e.g. CNC-205" />
        <span class="sub" id="new-machine-hint" style="display:none;color:var(--danger, #e05555);"></span>
      </div>

      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <input type="file" id="file-input" accept="application/pdf" style="display:none;" />
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
        <p><strong data-i18n="uploadManual">Upload manual</strong></p>
        <p data-i18n="dragDropHint" id="dropzone-hint">Drag a PDF here, or click to browse</p>
        <div class="progress-track" id="upload-progress-track" style="display:none;">
          <div class="progress-fill" id="upload-progress-fill" style="width:0%;"></div>
        </div>
      </div>

      <div class="list" id="manuals-list"></div>
    </section>

  </main>
</div>

<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
