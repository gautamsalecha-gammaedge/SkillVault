<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>SkillVault — Worker Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/worker.css" />
<style>
  :root {
    --bg-main: #0f1217;
    --surface-1: #181c24;
    --surface-2: #222834;
    --border: #2e3646;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --primary-amber: #f59e0b;
    --danger-red: #ef4444;
    --success-green: #10b981;
    --radius-lg: 16px;
    --radius-md: 12px;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Noto Sans', sans-serif;
    margin: 0;
    padding: 0;
  }

  .app-shell {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Header Navigation */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }

  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark {
    width: 32px;
    height: 32px;
    background: var(--primary-amber);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Machine Context Bar */
  .machine-bar {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .machine-select {
    width: 100%;
    max-width: 240px;
    padding: 8px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-main);
    border-radius: 8px;
    font-weight: 600;
  }

  /* Mode Navigation Tabs */
  .mode-tabs {
    display: flex;
    background: var(--surface-1);
    padding: 4px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    gap: 4px;
  }

  .mode-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
  }

  .mode-tab[aria-selected="true"] {
    background: var(--surface-2);
    color: var(--text-main);
  }

  .mode-panel {
    display: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    flex: 1;
    flex-direction: column;
  }

  .mode-panel.is-active {
    display: flex;
  }

  /* Integrated Single-Bar Input with Embedded Mic */
  .input-bar-wrapper {
    display: flex;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 6px 8px 6px 18px;
    gap: 10px;
    transition: border-color 0.2s;
  }

  .input-bar-wrapper:focus-within {
    border-color: var(--primary-amber);
  }

  .smart-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-size: 0.95rem;
    font-family: inherit;
  }

  .mic-inline-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .mic-inline-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
  }

  .mic-inline-btn.listening {
    background: var(--danger-red);
    color: #fff;
    animation: mic-pulse 1.3s infinite;
  }

  @keyframes mic-pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  .send-inline-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--primary-amber);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Utility buttons & cards */
  .action-btn {
    background: var(--primary-amber);
    color: #000;
    font-weight: 700;
    border: none;
    padding: 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    width: 100%;
  }

  .tip-step { display: none; flex-direction: column; gap: 12px; }
  .tip-step.is-active { display: flex; }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-brand">
      <div class="mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z" stroke="#17130a" stroke-width="2.5"/><path d="M9 12l2 2 4-4" stroke="#17130a" stroke-width="2.5"/></svg>
      </div>
      <strong data-i18n="appName">SkillVault</strong>
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <span id="greeting" style="font-size:0.85rem; color:var(--text-muted);"></span>
      <button class="icon-btn" id="btn-logout" title="Log out" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- Machine Bar -->
  <div class="machine-bar" id="machine-bar" style="display:none;">
    <span style="font-size:0.85rem; color:var(--text-muted);" data-i18n="machineSelectorLabel">Machine</span>
    <select class="machine-select" id="machine-select"></select>
  </div>

  <div class="workspace" id="workspace" style="display:none; flex:1; display:flex; flex-direction:column; gap:16px;">
    <!-- Mode Tabs -->
    <div class="mode-tabs" role="tablist">
      <button class="mode-tab" role="tab" aria-selected="true" id="mode-tab-ask">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span data-i18n="tabAsk">Ask Question</span>
      </button>
      <button class="mode-tab" role="tab" aria-selected="false" id="mode-tab-tip">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a6 6 0 00-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0012 2z"/></svg>
        <span data-i18n="tabShareTip">Share Tip</span>
      </button>
    </div>

    <!-- ASK PANEL -->
    <section class="mode-panel is-active" id="panel-ask">
      <div id="chat-scroll" style="flex:1; min-height:220px;">
        <div id="ask-empty" style="text-align:center; padding:40px 16px;">
          <h4 id="ask-empty-title" style="margin:0 0 8px 0;" data-i18n="askEmptyTitle">Ask anything about this machine</h4>
          <p style="color:var(--text-muted); font-size:0.85rem; margin:0;" data-i18n="askEmptyBody">Type or speak your question directly.</p>
          <div id="example-chips" style="margin-top:16px; display:flex; gap:8px; justify-center; flex-wrap:wrap;"></div>
        </div>
      </div>

      <!-- Combined Bar Form -->
      <form id="ask-form" style="margin-top:auto;">
        <div class="input-bar-wrapper">
          <input type="text" class="smart-input" id="ask-input" placeholder="Ask a question or tap mic..." required />
          <button type="button" class="mic-inline-btn" id="ask-mic-btn" title="Speak question">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4"/>
            </svg>
          </button>
          <button type="submit" class="send-inline-btn" id="ask-send-btn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </form>
    </section>

    <!-- TIP PANEL -->
    <section class="mode-panel" id="panel-tip">
      <div class="tip-card">
        <!-- Step 1: Input -->
        <div class="tip-step is-active" id="tip-step-write">
          <p style="color:var(--text-muted); font-size:0.85rem; margin:0 0 8px 0;" data-i18n="tipIntro">Share a fix or shortcut for this machine.</p>
          
          <div class="input-bar-wrapper">
            <input type="text" class="smart-input" id="tip-text" placeholder="Type or speak your tip..." />
            <button type="button" class="mic-inline-btn" id="tip-mic-btn" title="Speak tip">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4"/>
              </svg>
            </button>
          </div>

          <button class="action-btn" id="tip-review-btn" style="margin-top:12px;">
            <span data-i18n="tipSubmit">Review Tip</span>
          </button>
        </div>

        <!-- Step 2: Clarify -->
        <div class="tip-step" id="tip-step-clarify">
          <div style="font-weight:600;" data-i18n="tipClarifyingTitle">Clarification Needed</div>
          <p id="clarify-question" style="font-size:0.9rem; color:var(--primary-amber); margin:0;"></p>
          <div class="input-bar-wrapper">
            <input type="text" class="smart-input" id="clarify-answer" placeholder="Answer or speak clarification..." />
            <button type="button" class="mic-inline-btn" id="clarify-mic-btn" title="Speak answer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4"/></svg>
            </button>
          </div>
          <button class="action-btn" id="clarify-continue-btn">Continue</button>
        </div>

        <!-- Step 3: Polish -->
        <div class="tip-step" id="tip-step-polish">
          <label style="font-size:0.85rem;" data-i18n="tipPolishedLabel">Review Polished Tip</label>
          <textarea class="smart-input" id="polished-text" rows="4" style="border:1px solid var(--border); border-radius:12px; padding:12px;"></textarea>
          <button class="action-btn" id="tip-save-btn">Save Tip</button>
        </div>

        <!-- Step 4: Success -->
        <div class="tip-step" id="tip-step-success" style="text-align:center;">
          <h4 data-i18n="tipSuccessTitle">Tip Saved</h4>
          <p style="color:var(--text-muted); font-size:0.85rem;" data-i18n="tipSuccessBody">Sent for approval.</p>
          <button class="action-btn" id="tip-another-btn">Share Another Tip</button>
        </div>
      </div>
    </section>
  </div>

  <div class="empty-shell" id="no-machines" style="display:none; text-align:center; padding:40px;">
    <h4 data-i18n="noMachinesTitle">No machines assigned</h4>
  </div>
</div>

<audio id="tts-audio" style="display:none;"></audio>

<!-- Automatic Speech-to-Text Script -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Setup Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      console.warn('Web Speech API is not supported in this browser.');
      return;
    }

    function setupAutoVoice(micBtnId, inputId) {
      const micBtn = document.getElementById(micBtnId);
      const inputEl = document.getElementById(inputId);
      if (!micBtn || !inputEl) return;

      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let isListening = false;

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          recognition.start();
        } else {
          recognition.stop();
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        inputEl.value = transcript;
      };

      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
      };
    }

    // Attach speech recognition directly to input fields
    setupAutoVoice('ask-mic-btn', 'ask-input');
    setupAutoVoice('tip-mic-btn', 'tip-text');
    setupAutoVoice('clarify-mic-btn', 'clarify-answer');
  });
</script>

<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/worker.js"></script>
</body>
</html>
